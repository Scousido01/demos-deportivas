<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="view-transition" content="same-origin">
  <title>Demo</title>
  <link rel="stylesheet" href="css/base.css">
  <!-- Estilo propio del nicho o cliente (puede no existir) -->
  <link rel="stylesheet" href="estilo.css">
  <script src="config.js"></script>
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="#inicio" data-marca></a>
    <button class="menu-boton" aria-expanded="false" aria-controls="menu" data-menu-boton>Menú</button>
    <nav id="menu" class="menu" data-menu></nav>
  </header>

  <main>
    <section id="inicio" class="portada" data-seccion="portada">
      <div class="portada-media" data-portada-media></div>
      <div class="portada-texto">
        <h1 data-texto="portada.titulo"></h1>
        <p data-texto="portada.subtitulo"></p>
        <a class="boton" href="#reservas" data-texto="portada.boton"></a>
      </div>
    </section>

    <section id="quienes" class="bloque" data-seccion="quienesSomos" data-menu-titulo="Quiénes somos">
      <h2 data-texto="quienesSomos.titulo"></h2>
      <p class="intro" data-texto="quienesSomos.texto"></p>
      <ul class="datos" data-datos></ul>
    </section>

    <section id="servicios" class="bloque" data-seccion="servicios" data-menu-titulo="Servicios">
      <h2>Servicios</h2>
      <div class="tarjetas" data-tarjetas></div>
    </section>

    <section id="recorrido" class="scroll-guiado" data-seccion="scrollGuiado">
      <div class="scroll-guiado-fijo">
        <canvas data-scroll-canvas></canvas>
        <div class="scroll-guiado-textos" data-scroll-textos></div>
      </div>
    </section>

    <section id="horarios" class="bloque" data-seccion="horarios" data-menu-titulo="Horarios">
      <h2>Horarios</h2>
      <dl class="horarios" data-horarios></dl>
    </section>

    <section id="tarifas" class="bloque" data-seccion="tarifas" data-menu-titulo="Tarifas">
      <h2>Tarifas</h2>
      <div class="tarifas" data-tarifas></div>
    </section>

    <section id="galeria" class="bloque" data-seccion="galeria" data-menu-titulo="Galería">
      <h2>Galería</h2>
      <div class="galeria" data-galeria></div>
    </section>

    <section id="modelo" class="bloque" data-seccion="modelo3d">
      <h2 data-texto="modelo3d.titulo"></h2>
      <div class="modelo" data-modelo></div>
    </section>

    <section id="reservas" class="bloque" data-seccion="reservas" data-menu-titulo="Reservas">
      <h2 data-texto="reservas.titulo"></h2>
      <form class="reservas" data-reservas novalidate></form>
    </section>

    <section id="contacto" class="bloque" data-seccion="contacto" data-menu-titulo="Contacto">
      <h2>Contacto</h2>
      <div class="contacto">
        <div class="contacto-datos" data-contacto></div>
        <div class="mapa" data-mapa></div>
      </div>
    </section>
  </main>

  <footer class="pie" data-pie></footer>
  <a class="whatsapp-flotante" data-whatsapp-flotante aria-label="Escríbenos por WhatsApp">WhatsApp</a>

  <script src="js/app.js"></script>
  <!-- Secciones propias del nicho o cliente (puede no existir). Usa window.Demo; nunca toca los efectos. -->
  <script src="nicho.js"></script>
  <script src="js/efectos/tilt.js"></script>
  <script src="js/efectos/scroll-video.js"></script>
  <script src="js/efectos/reservas.js"></script>
  <script src="js/efectos/modelo-3d.js"></script>
</body>
</html>
